# GSD-2 Configuration for OpenHub
# See: https://gsd.build/docs

[project]
name = "OpenHub"
version = "1.0.0"
description = "Multi-agent coordination platform for local development environments"

[auth]
# Use Hermes OpenAI Codex OAuth credentials from the local user profile.
# Required runtime credential: configured openai-codex auth; do not store tokens in this repo.
# Do not commit real credential values.
provider = "openai-codex"

[workflow]
# Git workflow settings
worktree = true
branch_pattern = "feature/{slice}"
merge_strategy = "squash"
commit_style = "conventional"

# Verification commands (run after each task)
verify = [
  ". .venv/bin/activate && pytest -q --tb=short --disable-warnings",
  "cd web && npm audit --audit-level=moderate",
  "cd web && npm run lint -- --max-warnings=0",
  "cd web && npm run typecheck",
  "cd web && npm run test -- --run",
  "cd web && npm run build"
]

# Budget limits (optional)
# budget_usd = 10.0
# token_ceiling = 1000000

[model]
# All GSD phases and variations should run on GPT 5.5 via OpenAI Codex unless explicitly overridden by the human operator.
default = "gpt-5.5"
research = "gpt-5.5"
planning = "gpt-5.5"
implementation = "gpt-5.5"
verification = "gpt-5.5"
effort = "max"
reasoning_effort = "xhigh"

[paths]
# GSD-2 directory structure
planning_dir = ".gsd"
legacy_planning_dir = ".planning"
docs_dir = "docs"
tests_dir = "tests"

[commands]
# Project-specific commands
start = "uvicorn app.main:app --host 0.0.0.0 --port 7788 --reload"
build = "docker compose build"
test = ". .venv/bin/activate && pytest -q --tb=short --disable-warnings"
lint = "cd web && npm run lint -- --max-warnings=0"
frontend_typecheck = "cd web && npm run typecheck"
frontend_test = "cd web && npm run test -- --run"
frontend_build = "cd web && npm run build"
frontend_audit = "cd web && npm audit --audit-level=moderate"
backend_lint_baseline = ". .venv/bin/activate && black --check app/ && isort --check app/ && flake8 app/ && mypy app/"
