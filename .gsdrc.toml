# GSD-2 Configuration for OpenHub
# See: https://gsd.build/docs

[project]
name = "OpenHub"
version = "1.0.0"
description = "Multi-agent coordination platform for local development environments"

[auth]
# Use Claude Code / Anthropic credentials from the local environment.
# Required runtime credential: ANTHROPIC_API_KEY or Claude Code OAuth login.
# Do not commit real credential values.
provider = "anthropic"

[workflow]
# Git workflow settings
worktree = true
branch_pattern = "feature/{slice}"
merge_strategy = "squash"
commit_style = "conventional"

# Verification commands (run after each task)
verify = [
  "pytest",
  "mypy app/",
  "flake8 app/",
  "black --check app/",
  "isort --check app/"
]

# Budget limits (optional)
# budget_usd = 10.0
# token_ceiling = 1000000

[model]
# All GSD phases and variations should run on Claude Opus 4.7 unless explicitly overridden by the human operator.
# Claude Code accepts the alias `opus`; GSD's catalog resolves Anthropic opus to `claude-opus-4-7`.
default = "claude-opus-4-7"
research = "claude-opus-4-7"
planning = "claude-opus-4-7"
implementation = "claude-opus-4-7"
verification = "claude-opus-4-7"
effort = "max"

[paths]
# GSD-2 directory structure
planning_dir = ".gsd"
legacy_planning_dir = ".planning"
docs_dir = "docs"
tests_dir = "tests"

[commands]
# Project-specific commands
start = "uvicorn app.main:app --host 0.0.0.0 --port 7788 --reload"
build = "docker-compose build"
test = "pytest"
lint = "black --check app/ && isort --check app/ && flake8 app/ && mypy app/"
